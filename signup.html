<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up · Email Signature Generator</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="page">
    <div class="card auth-card">
      <h2>Create your account</h2>
      <form id="signup-form">
        <div class="field">
          <label for="name">Full name</label>
          <input type="text" id="name" required />
        </div>
        <div class="field">
          <label for="email">College email</label>
          <input type="email" id="email" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" minlength="6" required />
        </div>
        <button class="btn" type="submit" style="width:100%;">Sign Up</button>
        <div class="error" id="error"></div>
      </form>
      <div class="auth-link">
        Already have an account? <a href="login.html">Log in</a>
      </div>
      <div class="auth-link">
        Prefer Google? <a href="login.html">Continue with Google</a> instead — it works for both sign-up and log-in.
      </div>
    </div>
  </div>
  <script type="module" src="js/signup.js"></script>
</body>
</html>
